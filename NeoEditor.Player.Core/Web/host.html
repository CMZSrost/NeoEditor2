<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Neo Scavenger (Ruffle Web Preview)</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        #container { width: 100vw; height: 100vh; }
        #overlay {
            position: fixed; left: 0; top: 0; right: 0; bottom: 0;
            display: none; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.85); color: #eee;
            font-family: sans-serif; font-size: 14px; line-height: 1.6;
            padding: 24px; text-align: center; z-index: 10;
        }
        #overlay h2 { color: #ffb14e; margin: 0 0 8px; }
        #overlay code { color: #7fc8ff; }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="overlay"></div>

    <!-- v2.44: LSO 存档引用展开器（Ruffle #1069 修复）—— 必须在下方 getItem 包装之前加载 -->
    <script src="lso-expand-web.js"></script>
    <!-- v2.47 修复：启动时展开 localStorage 里的存档（引用全内联 + 写端表语义），
     修复 Ruffle/flash-lso 引用表不同步导致的存档读取崩溃（m_fDate/fDurability on Number）。
     v2.64: 去掉逐条 info/warn 启动日志（用户反馈噪音）——只保留 error（LsoExpand
     不可用/展开失败，诊断用）。 -->
    <script>
    (function () {
        function post(level, msg) {
            try {
                fetch("/__log", {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ run: Date.now(), level: level, msg: msg }),
                    keepalive: true
                }).catch(function () {});
            } catch (e) {}
        }
        try {
            if (!window.LsoExpand || !window.LsoExpand.expand) {
                post("error", "启动展开: LsoExpand 不可用（lso-expand-web.js 加载失败?）");
                return;
            }
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf("nsSGv1") !== -1) {
                    var v = localStorage.getItem(k);
                    if (v && v.indexOf("AL8A") === 0) {
                        var exp = window.LsoExpand.expand(v);
                        if (exp && exp !== v) {
                            localStorage.setItem(k, exp);   // 展开后写回，游戏读到全内联版本
                        }
                    } else {
                        post("warn", "启动展开: " + k + " 非 AL8A LSO 前缀");
                    }
                }
            }
        } catch (e) {
            post("error", "启动展开失败: " + (e && e.message ? e.message : e));
        }
    })();
    </script>



    <script>
        // ── 日志捕获（Docs/42 §3.4）──
        // 必须在 ruffle.js 之前执行：拦截 console（Ruffle 自身日志 + SWF trace()）、
        // 页面错误与游戏剪贴板日志（游戏把内部日志写入剪贴板），转发到同源 /__log。
        (function () {
            var orig = {};
            ["log", "info", "warn", "error", "debug", "trace"].forEach(function (k) {
                orig[k] = console[k] ? console[k].bind(console) : function () {};
                console[k] = function () {
                    orig[k].apply(console, arguments);
                    var parts = [];
                    for (var i = 0; i < arguments.length; i++) {
                        var a = arguments[i];
                        if (typeof a === "string") {
                            // v2.29: strip Ruffle's "%c" style markers and pure-style
                            // arguments ("color: lawngreen; ...") — they were polluting
                            // every console line.
                            var s = a.replace(/%c/g, "");
                            if (/^\s*(color|background|font-style|font-weight)[\s:;]/.test(s)) continue;
                            parts.push(s);
                        } else {
                            parts.push(safeStringify(a));
                        }
                    }
                    // v2.29 fix: console.log/info/trace normalize to "console" (the UI
                    // level filter has console/clipboard/error/warn/debug — no "log").
                    send(k === "log" || k === "info" || k === "trace" ? "console" : k, parts.join(" "));
                };
            });
            function safeStringify(o) {
                try { return JSON.stringify(o); } catch (e) { return String(o); }
            }
            var RUN_ID = Date.now();
            var queue = [], timer = null;
            function send(level, msg) {
                queue.push({ level: level, msg: msg });
                if (!timer) timer = setTimeout(flush, 800);
            }
            function flush() {
                timer = null;
                var batch = queue; queue = [];
                // v2.29: group by level — the old code stamped EVERY batch as "console",
                // so clipboard/debug lines showed up as console and filtering was useless.
                var groups = {};
                batch.forEach(function (b) {
                    (groups[b.level] = groups[b.level] || []).push(b.msg);
                });
                Object.keys(groups).forEach(function (level) {
                    try {
                        fetch("/__log", {
                            method: "POST",
                            headers: { "Content-Type": "text/plain" },
                            body: JSON.stringify({
                                run: RUN_ID,
                                level: level,
                                msg: groups[level].join("\n")
                            }),
                            keepalive: true
                        }).catch(function () {});
                    } catch (e) {}
                });
            }
            window.addEventListener("error", function (e) {
                send("error", "window.onerror: " + (e.message || "") + " @ " + (e.filename || "") + ":" + (e.lineno || ""));
            });
            // v2.53: 未处理 Promise 拒绝（Ruffle 内部异步错误/加载失败）也进错误日志。
            window.addEventListener("unhandledrejection", function (e) {
                var r = e && e.reason;
                send("error", "unhandledrejection: " + (r && r.message ? r.message : String(r)));
            });
            // v2.53: 供后续脚本块（Ruffle 加载失败等）与宿主调试工具直接写日志。
            window.__log = function (level, msg) { send(level, msg); };

            // 游戏内部日志 = 剪贴板（v2.54：完全接管，不再写真实剪贴板、不再弹权限窗）。
            // 关键事实（v2.54 源码取证，web/src/ui.rs WebUiBackend::set_clipboard_content）：
            // Ruffle 的剪贴板写入**不走 navigator.clipboard.writeText**（注释：该 API 仅
            // HTTPS 安全上下文可用，本页是 http://127.0.0.1）——而是隐藏 textarea +
            // select() + document.execCommand("copy")。因此 v2.44-v2.53 的 writeText 包装
            // 从未被 Ruffle 调用；v2.53 前日志里的截获行全靠 readText 轮询读回（这就是
            // 当初加轮询的原因），v2.53 删掉轮询后 execCommand 仍写真实剪贴板。
            // v2.54 起：execCommand 拦截阻断真实写入；v2.59 起内容截获改走
            // HTMLTextAreaElement.prototype.value **setter 拦截**——Ruffle 的临时
            // textarea 无论挂在普通 DOM 还是 ruffle-player 的 shadow root，set_value
            // 必然经过该 setter（同步、位置无关、时序无关；v2.56 selection / v2.57
            // MutationObserver / v2.58 shadowRoot 查询均不可靠）。本页无其他 textarea，
            // 不会误伤。
            var lastClipboard = null;
            function captureClipboard(text) {
                var t = String(text == null ? "" : text);
                if (t && t !== lastClipboard) {
                    lastClipboard = t;
                    send("clipboard", "游戏剪贴板日志(截获): " + t.slice(0, 50000));
                }
            }
            try {
                // v2.59 核心截获：textarea.value setter——Ruffle 的临时 textarea 无论挂
                // 在普通 DOM 还是 shadow root，set_value 必然经过该 setter（同步、位置
                // 无关）。实机验证（v2.60 日志）：拦截已安装 + 游戏日志内容完整进日志。
                if (window.HTMLTextAreaElement && HTMLTextAreaElement.prototype) {
                    var valueDesc = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value');
                    if (valueDesc && typeof valueDesc.set === 'function') {
                        var origValueSet = valueDesc.set;
                        var origValueGet = valueDesc.get;
                        Object.defineProperty(HTMLTextAreaElement.prototype, 'value', {
                            configurable: true,
                            get: function () { return origValueGet.call(this); },
                            set: function (v) {
                                origValueSet.call(this, v);
                                try {
                                    if (typeof v === 'string' && v.length > 0) captureClipboard(v);
                                } catch (e) {}
                            },
                        });
                    }
                }
            } catch (e) {}
            try {
                // 拦截 document.execCommand（v2.54）：阻断真实剪贴板写入（实机验证：
                // 系统剪贴板为空 + 命中确认）。只阻断，不提取（提取走 value setter）。
                var origExecCommand = document.execCommand.bind(document);
                document.execCommand = function (cmd) {
                    var c = String(cmd == null ? "" : cmd).toLowerCase();
                    if (c === "copy" || c === "cut") return true;   // 不写真实剪贴板
                    return origExecCommand.apply(this, arguments);
                };
                if (navigator.clipboard) {
                    if (navigator.clipboard.writeText) {
                        // 防未来 Ruffle 版本/HTTPS 部署走 writeText 路径。
                        navigator.clipboard.writeText = function (text) {
                            captureClipboard(text);
                            return Promise.resolve();   // 只进日志；不写真实剪贴板
                        };
                    }
                    if (navigator.clipboard.readText) {
                        // 游戏无真实读剪贴板需求（Ruffle 读走自身 buffer，不碰此 API）；
                        // 返回空串避免读权限弹窗。
                        navigator.clipboard.readText = function () {
                            return Promise.resolve("");
                        };
                    }
                }
            } catch (e) {}

            // 存档备份（v2.37 + v2.43 语义修正）：POST /__backup 落盘
            // （{gameRoot}/save_backup，自动保留最近 5 份）。
            // - setItem：备份**写入的值**——每次保存都留下备份（v2.43 前只备旧值，
            //   首次写入/先删后写时 getItem 为 null 导致后续保存无备份）
            // - removeItem：备份被删除的旧值——死亡删档保护
            function backupValue(key, value) {
                try {
                    fetch("/__backup", {
                        method: "POST",
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify({ k: key, v: value }),
                        keepalive: true
                    }).catch(function () {});
                } catch (e) {}
            }
            try {
                // defineProperty (enumerable:false): a plain assignment would create
                // own *enumerable* props on the Storage instance, so Object.keys(localStorage)
                // would list setItem/removeItem as fake "saves" in the storage manager.
                var origSetItem = localStorage.setItem.bind(localStorage);
                // v2.72: 存档管理免重启方案（墓碑 + 恢复保护）——
                // - __deletedKeys[key]：存档管理「删除/清空」后墓碑化——游戏仍持有该存档的
                //   内存副本（Ruffle SharedObject 缓存，运行中从不重读 localStorage），其
                //   自动保存/卸载 flush 会把旧档写回（"删除复活"）。墓碑拦截写回 → 删除
                //   立即且永久生效，无需重启游戏；游戏继续可玩但该档保存被挂起，直到
                //   重启游戏（或游戏内新开档 clear 解除墓碑）。
                // - __protectedKeys[key]：存档管理「恢复」后保护——运行中游戏的内存副本
                //   是旧状态，其写回会覆盖刚恢复的存档（用户反馈的坑）。保护拦截写回 →
                //   恢复的存档安全保留在 localStorage，点「重启游戏」后生效。
                // - __managerOp：存档管理自己执行 setItem/removeItem 时置位，避免其
                //   操作被「游戏发起」的解除逻辑误判（见 removeItem 包装）。
                window.__deletedKeys = {};
                window.__protectedKeys = {};
                window.__managerOp = false;
                window.__blockLogged = {};
                // v2.74: 本会话游戏是否已读取过存档（nsSGv1 SharedObject 实例是否已创建）——
                // 反编译确认（DataHandler.as）：主菜单启动**不**读存档，首次
                // LoadGame/SaveGame/DeleteSave 才 SharedObject.getLocal 创建实例并缓存于
                // AVM（Ruffle 从不重读 localStorage）。未触碰时存档管理操作（删除/恢复/
                // 清空）直接生效、无需重启；已触碰后恢复才必须重启（读档界面读的是内存副本）。
                // 包装器能观察到 Ruffle 的每一次 get/set/remove（localStorage 通道），
                // 启动展开块在包装器安装前执行、不误标。
                window.__saveTouched = false;
                function __markTouched(key) {
                    if (key && key.indexOf("nsSGv1") !== -1) window.__saveTouched = true;
                }
                window.__tombstoneKey = function (k) { if (k) window.__deletedKeys[k] = true; };
                window.__protectKey = function (k) { if (k) window.__protectedKeys[k] = true; };
                window.__unmarkKey = function (k) { if (!k) return; delete window.__deletedKeys[k]; delete window.__protectedKeys[k]; };
                function __saveBlocked(key) {
                    if (!window.__blockLogged[key]) {
                        window.__blockLogged[key] = true;
                        try { window.__log("warn", "存档写回已拦截（已删除或已恢复保护）: " + key); } catch (e) {}
                    }
                }
                Object.defineProperty(localStorage, "setItem", {
                    value: function (key, value) {
                        // v2.50: 存档管理删除/恢复期间阻止一切写回——Ruffle 在页面卸载
                        // （pagehide/Drop）时 flush_shared_objects 会把缓存的旧档写回
                        // localStorage，删除存档后重启会"旧档复活"。存档管理操作前由
                        // 页面设置 window.__blockSaves = true，重启后新页面标志自动消失。
                        if (window.__blockSaves) return;
                        __markTouched(key);   // v2.74: 游戏保存 = 已触碰
                        // v2.72: 墓碑/保护拦截（免重启删除与恢复的核心）。
                        if (window.__deletedKeys[key] || window.__protectedKeys[key]) {
                            __saveBlocked(key);
                            return;
                        }
                        backupValue(key, value);
                        return origSetItem(key, value);
                    },
                    writable: true,
                    configurable: true,
                    enumerable: false
                });
                var origRemoveItem = localStorage.removeItem.bind(localStorage);
                Object.defineProperty(localStorage, "removeItem", {
                    value: function (key) {
                        try {
                            __markTouched(key);   // v2.74
                            var old = localStorage.getItem(key);
                            if (old !== null) backupValue(key, old);
                            // v2.51: 游戏内删除存档（SharedObject.clear → removeItem）后，
                            // Ruffle 页面卸载 flush_shared_objects 会把缓存 data 写回（存档复活）。
                            // 标记本次会话删除过存档 → beforeunload/pagehide 时拦截写回。
                            if (key && key.indexOf("nsSGv1") !== -1) window.__savesCleared = true;
                            // v2.72: 游戏内 clear/新开档 = 主动重新开始 → 解除墓碑/保护
                            // （新档的保存放行）；存档管理自己的操作（__managerOp）不受影响。
                            if (!window.__managerOp) window.__unmarkKey(key);
                        } catch (e) {}
                        return origRemoveItem(key);
                    },
                    writable: true,
                    configurable: true,
                    enumerable: false
                });
                // v2.51: 游戏内删除存档后，页面卸载（重启/关闭）时 Ruffle flush 写回缓存
                // data → 存档复活。卸载前若本会话删除过存档且 localStorage 里尚无新存档
                // （删除后没保存过新档），设置 __blockSaves 拦截写回；若已有新档（删除后
                // 玩新游戏已自动保存），放行 flush 以免丢失新档最后一段进度。
                // 监听器先于 Ruffle 注册（本脚本在 ruffle.js 之前加载）→ 先置标志。
                function __hasSave() {
                    for (var i = 0; i < localStorage.length; i++) {
                        var k = localStorage.key(i);
                        if (k && k.indexOf("nsSGv1") !== -1) return true;
                    }
                    return false;
                }
                window.addEventListener("beforeunload", function () {
                    if (window.__savesCleared && !__hasSave()) window.__blockSaves = true;
                });
                window.addEventListener("pagehide", function () {
                    if (window.__savesCleared && !__hasSave()) window.__blockSaves = true;
                });
                // v2.44: LSO 引用展开（Ruffle #1069 修复）—— getItem 拦截：
                // SWF 加载存档时把「含引用的原始 LSO」替换为「引用全部内联」的展开版本，
                // Ruffle 反序列化时无 Amf3ObjectReference 可误解析（引用→undefined/Number 崩溃）。
                // 只处理本游戏存档 key；解析失败回退原始值，绝不阻塞游戏。
                send("info", "NE v2.64 就绪 host=" + location.href);
                var origGetItem = localStorage.getItem.bind(localStorage);
                Object.defineProperty(localStorage, "getItem", {
                    value: function (key) {
                        var v = origGetItem(key);
                        if (v === null || !key || key.indexOf("nsSGv1") === -1) return v;
                        // v2.74: Ruffle 首次创建 SharedObject 实例会读 localStorage → 已触碰。
                        __markTouched(key);
                        try {
                            if (window.LsoExpand && window.LsoExpand.expand) {
                                var expanded = window.LsoExpand.expand(v);
                                if (expanded && expanded !== v) {
                                    send("debug", "LSO 展开: " + key + " " + v.length + "→" + expanded.length + "（引用全内联, Ruffle #1069 修复生效）");
                                    return expanded;
                                }
                            }
                        } catch (e) {
                            send("error", "LSO 展开失败, 回退原始值: " + (e && e.message ? e.message : e));
                        }
                        return v;
                    },
                    writable: true,
                    configurable: true,
                    enumerable: false
                });
            } catch (e) {}
        })();
    </script>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};

        function showOverlay(title, body) {
            var o = document.getElementById("overlay");
            o.innerHTML = "<h2>" + title + "</h2><div>" + body + "</div>";
            o.style.display = "flex";
        }

        // ── 日志窗口热键（v2.62）：F10 切换宿主日志窗口。capture 阶段监听，避免被
        //    游戏/Ruffle 的事件处理吞掉；仅 WebView2 宿主（window.chrome.webview
        //    存在）时转发。 ──
        document.addEventListener("keydown", function (e) {
            if (e.key === "F10") {
                try {
                    if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                        e.preventDefault();
                        window.chrome.webview.postMessage({ type: "toggle-overlay" });
                    }
                } catch (err) { /* host bridge unavailable */ }
            }
        }, true);

        // ── 阻止 Chromium 默认拖放（拖文件到播放区会变成"下载"）——
        //    SWF 请拖到顶栏或初始占位区（宿主侧拖放入口）。 ──
        document.addEventListener("dragover", function (e) { e.preventDefault(); });
        document.addEventListener("drop", function (e) { e.preventDefault(); });

        window.addEventListener("DOMContentLoaded", function () {
            var ruffle = window.RufflePlayer.newest();
            if (!ruffle) { showOverlay("Ruffle 加载失败", "Ruffle 未就绪 —— 请检查 Web/ruffle 资源是否完整。"); return; }

            var player = ruffle.createPlayer();
            player.config = {
                autoplay: "on",
                letterbox: "on",
                scale: "showAll",              // 等比适应窗口,不裁切不变形
                forceScale: true,              // 忽略 SWF 自身 scaleMode(noScale),窗口 resize 时画面自适应
                allowScriptAccess: false,
                openUrlMode: "deny",
                unmuteOverlay: "hidden",
                splashScreen: false,
                showSwfDownload: false,
                logLevel: "Warn",
                maxExecutionDuration: 600      // 秒;数据解析需数分钟,默认 15s 不够
            };
            player.style.width = "100%";
            player.style.height = "100%";
            player.style.display = "block";
            document.getElementById("container").appendChild(player);
            window.__player = player;       // 供宿主 InvokeScript / 页面 blur 处理调用
            window.__gameLoaded = false;    // loaded 事件后才算就绪（加载中不暂停）
            window.__backgroundMode = false;// 宿主「后台运行」开关：true 时失焦不暂停
            // v2.53: 宿主「导出日志」用——localStorage 快照（key/长度/前 200 字符预览；
            // 存档是 base64 大串，整段导出会撑爆报告文件，只带预览 + 长度）。
            window.__dumpLocalStorage = function () {
                var out = [];
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    var v = localStorage.getItem(k) || "";
                    out.push({ key: k, len: v.length, head: v.slice(0, 200) });
                }
                return out;
            };
            // v2.54: 宿主「导出存档+日志 zip」用——localStorage **全量**存档值
            // （含 nsSGv1 存档 key 的完整 base64），供打包备份/迁移。
            window.__exportSaves = function () {
                var out = [];
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    out.push({ key: k, value: localStorage.getItem(k) || "" });
                }
                return out;
            };

            player.addEventListener("loaded", function () { window.__gameLoaded = true; });

            // ── 失焦暂停（Docs/42 v2.7/v2.8）：游戏用 Stage.deactivate 实现失焦暂停，但 Ruffle
            //    只在 document.hidden（最小化/切 tab）时暂停 —— 窗口失焦（画面仍可见）不触发。
            //    页面级 window blur/focus 在宿主窗口失焦时必然触发，这里调用 RufflePlayer 的
            //    pause()/play() 补齐该行为；加载中不暂停；「后台运行」开启时不暂停。 ──
            window.addEventListener("blur", function () {
                try {
                    if (window.__gameLoaded && !window.__backgroundMode && window.__player && window.__player.pause)
                        window.__player.pause();
                } catch (e) {}
            });
            window.addEventListener("focus", function () {
                try {
                    if (window.__gameLoaded && !window.__backgroundMode && window.__player && window.__player.play)
                        window.__player.play();
                } catch (e) {}
            });

            // SWF 来源：默认游戏根目录 NEOScavenger.swf；?swf= 可切换对比源
            var swfUrl = "NEOScavenger.swf";
            try {
                var p = new URLSearchParams(location.search).get("swf");
                if (p) swfUrl = p;
            } catch (e) {}

            player.ruffle().load(swfUrl).catch(function (err) {
                // v2.53: 加载失败除了页面 overlay，还进 /__log（level=error）→ 宿主「报错捕捉」弹窗。
                try { window.__log("error", "SWF 加载失败: " + (err && err.message ? err.message : err)); } catch (e) {}
                showOverlay(
                    "SWF 加载失败",
                    "无法加载 <code>" + swfUrl + "</code><br>（" + (err && err.message ? err.message : err) + "）" +
                    "<br><br>完整游戏请用工具栏「用 Ruffle 启动」。");
            });
        });
    </script>


    <script src="ruffle/ruffle.js"></script>
</body>
</html>
