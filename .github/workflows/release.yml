name: Release Windows

# 手动打 tag（如 v1.0.0）时触发：打包 Windows 版并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release 所需

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (win-x64, self-contained single-file)
        shell: pwsh
        run: |
          dotnet publish NeoEditor.App/NeoEditor.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o publish/win-x64

      - name: Package zip
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Remove-Item publish/win-x64/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/win-x64/* -DestinationPath "NeoEditor-$tag-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeoEditor ${{ github.ref_name }}
          body: |
            Windows (x64) 自包含单文件版，解压后运行 `NeoEditor.exe`，无需安装 .NET 运行时。
          generate_release_notes: true
          files: NeoEditor-*-win-x64.zip
