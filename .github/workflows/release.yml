name: Release Windows

# 手动打 tag（如 v1.0.0）时触发：打包 Windows 版（编辑器 + 播放器）并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release 所需

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── 编辑器（NeoEditor.App）──
      - name: Publish editor (win-x64, self-contained single-file)
        shell: pwsh
        run: |
          dotnet publish NeoEditor.App/NeoEditor.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o publish/win-x64

      # ── 播放器（NeoEditor.Player / NeoScavengerPlayer，Docs/42 §八）──
      # csproj 已内置：RuntimeIdentifier=win-x64、SelfContained、Release DebugType=None、
      # StripPublishedSymbols（清 NuGet 原生 PDB）；IncludeNativeLibrariesForSelfExtract
      # 把 Skia/HarfBuzz/ANGLE 等 native dll 也打进 exe → 产物仅 exe + Web/（ruffle 外置）
      - name: Publish player (win-x64, self-contained single-file)
        shell: pwsh
        run: |
          dotnet publish NeoEditor.Player/NeoEditor.Player.csproj `
            -c Release `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/player-win-x64

      - name: Package zips
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Remove-Item publish/win-x64/*.pdb -ErrorAction SilentlyContinue
          Remove-Item publish/player-win-x64/*.pdb -ErrorAction SilentlyContinue
          Copy-Item NeoEditor.Player/README.txt publish/player-win-x64/README.txt
          Compress-Archive -Path publish/win-x64/* -DestinationPath "NeoEditor-$tag-win-x64.zip"
          Compress-Archive -Path publish/player-win-x64/* -DestinationPath "NeoScavengerPlayer-$tag-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeoEditor ${{ github.ref_name }}
          body: |
            Windows (x64) 自包含单文件版，无需安装 .NET 运行时。

            - **NeoEditor-${{ github.ref_name }}-win-x64.zip** — 编辑器（解压运行 `NeoEditor.exe`）
            - **NeoScavengerPlayer-${{ github.ref_name }}-win-x64.zip** — 独立播放器（解压运行 `NeoScavengerPlayer.exe`，拖入 SWF 即玩；需系统自带 WebView2 Runtime；运行时数据落盘于 `%LocalAppData%/NeoScavengerPlayer/`）
          generate_release_notes: true
          files: |
            NeoEditor-*-win-x64.zip
            NeoScavengerPlayer-*-win-x64.zip
